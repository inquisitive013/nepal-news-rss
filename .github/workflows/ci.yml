name: CI

# Once per change: on the pull request, then on main after the merge. A push to a branch with an
# open pull request used to run everything twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Mock edition end to end
        env:
          NEWSROOM_MOCK: "1"
        run: python -m newsroom run --mock --build --out site
      - uses: actions/upload-artifact@v4
        with:
          name: mock-site
          path: site
          retention-days: 3

  sources:
    # Informational. Probes the live feeds and image providers from a runner with open network access.
    # About three minutes, so it runs once per merged change, on main, not on every pull request update.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check sources
        run: python -m newsroom check-sources
      - name: Picture desk dry run
        # What the desk finds for every stored story, from a runner that can reach the
        # libraries: no model calls, nothing changed. Compared with the old one search per query way.
        run: python -m newsroom photos --dry-run --all --compare
