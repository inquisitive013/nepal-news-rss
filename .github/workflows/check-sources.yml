name: Check sources

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe feeds and image providers
        run: python -m newsroom check-sources
