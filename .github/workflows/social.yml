name: Post to social networks

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compose the posts and print them. Post nothing."
        type: boolean
        default: false
      networks:
        description: "Comma separated subset, e.g. facebook,telegram. Empty means every connected network."
        type: string
        default: ""
      article:
        description: "Post one article only, by id, e.g. 2026-09-27-some-slug. Ignores the age window."
        type: string
        default: ""
  workflow_call:

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The edition job may have pushed today's data to the branch after this run started.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Post to the connected networks
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          NETWORKS: ${{ inputs.networks }}
          ARTICLE: ${{ inputs.article }}
        run: |
          export SITE_URL="${SITE_URL_OVERRIDE:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          args=()
          [ -n "$DRY_RUN" ] && args+=(--dry-run)
          [ -n "$NETWORKS" ] && args+=(--networks "$NETWORKS")
          [ -n "$ARTICLE" ] && args+=(--article "$ARTICLE")
          set -o pipefail
          python -m newsroom social "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record what was posted
        if: always()
        run: |
          git config user.name "nepal-wire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/social
          if git diff --cached --quiet; then
            echo "No social posts to record."
          else
            git commit -m "Social posts $(TZ=Asia/Kathmandu date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
