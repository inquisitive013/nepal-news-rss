name: Daily edition

on:
  schedule:
    # 00:30 UTC is 06:15 in Nepal. Editions publish before the morning commute.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mock:
        description: "Preview run: mock model, fixture feeds, nothing committed or deployed"
        type: boolean
        default: false
      rebuild_only:
        description: "Rebuild and deploy the site from existing data. No model calls, nothing committed."
        type: boolean
        default: false
      backfill_nepali:
        description: "Write the Nepali edition for published stories, commit and deploy. No new edition, no posts. Up to five model calls per story."
        type: boolean
        default: false
      nepali_scope:
        description: "Which stories the Nepali backfill writes"
        type: choice
        options: [missing, all]
        default: missing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      no_key: ${{ steps.newsroom.outputs.no_key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          # The card renderer draws with DejaVu. The runner image normally carries it.
          [ -d /usr/share/fonts/truetype/dejavu ] || sudo apt-get install -y -q fonts-dejavu-core

      - name: Catch up with the branch
        if: ${{ inputs.mock != true }}
        run: |
          # A queued run checks out the commit that queued it. An edition that landed since
          # must be in the working tree, or this run writes the same stories again and its
          # commit collides with theirs.
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Run the newsroom and build the site
        id: newsroom
        env:
          # Option A: a repository secret holding an Anthropic API key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Option B: identity federation. Non secret IDs stored as repository variables.
          # The workflow's GitHub identity token is minted on demand by the pipeline.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # A repository variable SITE_URL overrides the default project Pages address.
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          NEWSROOM_MOCK: ${{ inputs.mock == true && '1' || '' }}
          NEWSROOM_REBUILD_ONLY: ${{ inputs.rebuild_only == true && '1' || '' }}
          NEWSROOM_BACKFILL: ${{ inputs.backfill_nepali == true && '1' || '' }}
          NEWSROOM_BACKFILL_SCOPE: ${{ inputs.nepali_scope || 'missing' }}
        run: |
          export PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          if [ -n "${SITE_URL_OVERRIDE}" ]; then export SITE_URL="${SITE_URL_OVERRIDE}"; fi
          python -c 'from newsroom.config import load_settings; print("Site URL:", load_settings().site_url)'
          if [ -n "${NEWSROOM_REBUILD_ONLY}" ]; then
            echo "Rebuild only: no new edition, no model calls."
            python -m newsroom build --out site
            exit 0
          fi
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo "Model access: API key secret"
          elif [ -n "${ANTHROPIC_FEDERATION_RULE_ID}" ] && [ -n "${ANTHROPIC_ORGANIZATION_ID}" ]; then
            echo "Model access: identity federation (rule ${ANTHROPIC_FEDERATION_RULE_ID})"
          elif [ -z "${NEWSROOM_MOCK}" ]; then
            echo "::warning::No Anthropic credentials configured. Rebuilding the site from existing data without a new edition."
            echo "no_key=true" >> "$GITHUB_OUTPUT"
            python -m newsroom build --out site
            exit 0
          fi
          if [ -n "${NEWSROOM_BACKFILL}" ]; then
            echo "Backfill: writing the Nepali edition (${NEWSROOM_BACKFILL_SCOPE} stories), then rebuilding."
            python -m newsroom nepali "--${NEWSROOM_BACKFILL_SCOPE}" || echo "::warning::Some stories could not be written in Nepali. The log above names them; the rest are saved."
            python -m newsroom build --out site --root-rss
            exit 0
          fi
          python -m newsroom run --build --out site --root-rss

      - name: Commit the edition data
        id: commit
        if: ${{ inputs.mock != true && inputs.rebuild_only != true }}
        run: |
          git config user.name "nepal-wire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only data/ and rss.xml change during a run. site/ is ignored by git.
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            if [ -n "${{ inputs.backfill_nepali == true && '1' || '' }}" ]; then
              git commit -m "Nepali edition $(TZ=Asia/Kathmandu date +%F)"
            else
              git commit -m "Edition $(TZ=Asia/Kathmandu date +%F)"
            fi
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::Another commit changed the same edition files while this run was working. The edition is kept as the workflow artifact edition-data-${GITHUB_RUN_ID}: download it and commit the files by hand."
              exit 1
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Keep the edition when the commit fails
        if: ${{ failure() && steps.commit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: edition-data-${{ github.run_id }}
          path: |
            data
            rss.xml
          retention-days: 14

      - name: Upload preview site
        if: ${{ inputs.mock == true }}
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site

      - name: Make GitHub Actions the Pages source
        if: ${{ inputs.mock != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A Pages site set to build from a branch rebuilds itself after every edition
          # commit and overwrites what this workflow deployed. Switch it to Actions once.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          hdr=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          current=$(curl -sS "${hdr[@]}" "$api" | python -c 'import json,sys; print(json.load(sys.stdin).get("build_type", ""))' 2>/dev/null || echo "")
          echo "Pages build type: ${current:-unknown}"
          if [ "$current" = "legacy" ]; then
            code=$(curl -sS -o pages-response.json -w '%{http_code}' -X PUT "${hdr[@]}" "$api" -d '{"build_type":"workflow"}')
            if [ "$code" = "204" ]; then
              echo "Switched the Pages source to GitHub Actions."
            else
              # The workflow token may not be allowed to change repository settings.
              msg="The Pages source is still \"Deploy from a branch\", so GitHub rebuilds the site from the repository after every push and overwrites this deployment. One click fixes it: Settings → Pages → Build and deployment → Source → GitHub Actions."
              echo "::warning::Could not switch the Pages source (HTTP $code). $msg"
              printf '## Pages source needs one click\n\n%s\n\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
              cat pages-response.json || true
            fi
            rm -f pages-response.json
          fi

      - name: Configure Pages
        if: ${{ inputs.mock != true }}
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site if the repository has none yet.
          enablement: true

      - name: Upload Pages artifact
        if: ${{ inputs.mock != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Run summary
        if: always()
        run: |
          latest=$(ls -t data/runs/*.json 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            python - "$latest" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              run = json.load(open(sys.argv[1]))
          except Exception as exc:  # a conflicted or half written record
              print(f"## Edition record could not be read ({type(exc).__name__})")
              sys.exit(0)
          print(f"## Edition {run['run_date']} ({run['mode']}) status: {run['status']}")
          print()
          print(f"- Candidates: {len(run['candidates'])} from {sum(1 for h in run['feed_health'] if h['ok'])}/{len(run['feed_health'])} working feeds")
          print(f"- Stories debated: {len(run['stories'])}")
          print(f"- Published: {', '.join(run['published']) or 'none'}")
          print(f"- Not published: {len(run['rejected'])}")
          t = run.get('usage_totals', {})
          print(f"- Model calls: {t.get('calls')} | input tokens {t.get('input_tokens')} | output tokens {t.get('output_tokens')} | web searches {t.get('web_search_requests')}")
          for e in run['errors'][:5]:
              print(f"- Error: {e.splitlines()[0][:200]}")
          PY
          fi

  deploy:
    # A separate job so the newsroom job keeps a plain branch identity for federation.
    needs: edition
    if: ${{ inputs.mock != true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail loudly when no edition could run
        if: ${{ needs.edition.outputs.no_key == 'true' }}
        run: |
          {
            echo "## No edition today"
            echo
            echo "The site was rebuilt and deployed from existing data, but no new edition ran because no Anthropic credentials are configured."
            echo
            echo "Either add the **ANTHROPIC_API_KEY** repository secret, or set up identity federation and add the"
            echo "**ANTHROPIC_FEDERATION_RULE_ID**, **ANTHROPIC_ORGANIZATION_ID** and **ANTHROPIC_SERVICE_ACCOUNT_ID** repository variables."
            echo "See the README section \"Model credentials\". Then run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::No Anthropic credentials configured. Site deployed, no edition produced."
          exit 1

  social:
    # Runs after the site is live because Instagram and Threads fetch the picture from it.
    # The same job runs on its own from Actions → "Post to social networks".
    needs: [edition, deploy]
    if: ${{ inputs.mock != true && inputs.rebuild_only != true && inputs.backfill_nepali != true && needs.edition.outputs.no_key != 'true' }}
    uses: ./.github/workflows/social.yml
    secrets: inherit
