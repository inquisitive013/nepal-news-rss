# Newsroom settings. Environment variables override a few of these:
#   ANTHROPIC_API_KEY   required for a live run
#   OPENAI_API_KEY      optional, enables AI image generation
#   SITE_URL            overrides site.url (the daily workflow sets it from GitHub Pages)
#   NEWSROOM_MOCK=1     forces mock mode (no network, no keys)

site:
  name: "Nepal Wire"
  tagline: "Nepal's day, ranked and checked before it reaches you"
  # GitHub Pages serves a project site at https://<owner>.github.io/<repo>/
  url: "https://inquisitive013.github.io/nepal-news-rss"
  # Your own domain once it points at GitHub Pages (README: Your own domain). Empty keeps the address above.
  custom_domain: ""
  # Shown on the sponsor and standards pages. Empty hides the address.
  contact_email: ""
  # The token from Google Search Console's HTML tag method, e.g. "abc123...". Empty renders nothing.
  google_site_verification: ""
  # A verified line for the sponsor page, e.g. "10,300 followers as of September 2026". Empty keeps the generic wording.
  facebook_followers: ""

newsletter:
  # The provider's subscribe page (Beehiiv, Substack, Buttondown). Rendered as a button wherever the sign up box appears.
  signup_url: ""
  # The provider's embed form HTML, if you prefer the form inline. Wins over signup_url.
  embed_html: ""
  # The paid tier for the investigations. Empty hides the member links.
  members_url: ""

ads:
  # Google AdSense publisher id, e.g. "ca-pub-1234567890123456". Empty renders no ads and no ads.txt.
  adsense_client: ""
  # Language of the published articles: "en" or "ne". Sources are read in both.
  language: "en"
  timezone: "Asia/Kathmandu"
  publisher: "Nepal Wire newsroom"

pipeline:
  # Hours back from run time that count as "today".
  window_hours: 24
  # Hard caps that keep a bad feed from flooding the day.
  max_candidates: 150
  max_per_source: 15
  # How many stories go through the advocate vs skeptic debate. Two calls per story.
  # With three debated and three written, the ranking judges order the stories and can
  # still drop a weak one. They no longer choose among extras.
  max_debate_stories: 3
  # How many of the judged stories become articles.
  articles_per_day: 3
  # Before the writer starts, an investigator searches for what the coverage misses:
  # the record, numbers that do not add up, who benefits, the missing question, the
  # pattern. One call per article with web search. Set false to skip it.
  investigate: true
  # Red team and defence passes per article. With one, the red team reads the first draft
  # only and validation judge 2 reads the revision as the final check.
  red_team_rounds: 1
  # Revisions allowed per article: one after judge 1, one more if judge 2 sends it back.
  max_revisions: 2
  # Revisions allowed across the whole day. Caps the reviser at this many calls.
  max_revisions_per_run: 5
  # Parallel debates / articles in flight.
  concurrency: 3
  # Safety valve. The run stops taking new work after this many model calls.
  # A normal day is about 33: clusterer 1, advocate 3, skeptic 3, ranking judges 2,
  # investigator 3, writer 3, picture check 3, red team 3, defence 3, validation judges 6,
  # reviser 3.
  max_llm_calls: 45

llm:
  # Default model and thinking effort for every role. Override a role under `roles`.
  # The first live edition on claude-opus-5 at high effort with two revision rounds
  # cost about 19 dollars. The second, on Sonnet 5 with Opus 5.5 judges and two red team
  # rounds, about 6.40. This configuration is built for about 6 a day, of which the
  # investigator is about 1.50.
  model: "claude-sonnet-5"
  effort: "medium"
  # Replies stream, so this can be large. Thinking counts against it, and the
  # reviser must think and then return a whole article.
  max_tokens: 64000
  # Server side refusal fallback (beta). Set false if your org rejects the beta header.
  refusal_fallback: true
  # Web search uses allowed per role call.
  web_search_uses:
    advocate: 3
    skeptic: 3
    writer: 6
    red_team: 5
    defense: 2
    # The investigator lives on search. Records, old reports, budgets, court orders.
    investigator: 8
    # Used only when judge 2 checks a revision the red team will not see again.
    validation_judge: 2
  roles:
    # The judges read everything and decide. Short replies, so the stronger model is cheap here.
    ranking_judge: { model: "claude-opus-5-5", effort: "high" }
    validation_judge: { model: "claude-opus-5-5", effort: "high" }
    writer: { effort: "high" }
    # The investigation is the newsroom's edge, so it gets the thinking budget too.
    investigator: { effort: "high" }

editorial:
  exclude_topics:
    - "horoscopes and astrology"
    - "graphic descriptions of violence or accident victims"
    - "unverified rumours about private individuals"
    - "paid promotions and press releases dressed as news"
  # Guidance handed to the judges. Judges decide, these are not hard gates.
  guidance:
    min_virality_score: 60
    min_accuracy_score: 85
    min_defensibility_score: 85

images:
  # Licences accepted for found images. Matched case insensitively as substrings
  # of the licence short name reported by the provider.
  allowed_licenses: ["cc0", "public domain", "pdm", "cc by", "cc-by", "by-sa", "cc by-sa"]
  max_candidates_for_vision: 6
  max_width: 1600
  jpeg_quality: 84
  # Burn a small credit bar into the stored image so shared copies carry attribution.
  burn_credit: true
  generation:
    # "openai" needs OPENAI_API_KEY. "none" skips generation and uses the cover card.
    provider: "openai"
    openai_model: "gpt-image-1"
    size: "1536x1024"

social:
  # A network is switched on by its secrets alone (see README, "Social media").
  # This list only sets the posting order.
  networks: [x, facebook, instagram, threads, telegram, bluesky, mastodon]
  # Networks listed here are still checked but never posted to. Remove a name to resume.
  # Facebook waits here until the Page is renamed to Nepal Wire.
  paused: []
  # Announce only articles published within this many hours, so connecting a new account
  # never floods it with the archive.
  max_age_hours: 36
  # Hashtags per network, built from each article's tags.
  hashtags: {x: 2, facebook: 3, instagram: 8, threads: 3, telegram: 0, bluesky: 2, mastodon: 3}
  # Instagram and Threads fetch the picture from the site, so wait for the page to be live.
  wait_for_site_seconds: 180
  facebook:
    # "photo": the 1080x1400 card with the engine caption (headline, hook, body, trigger,
    # "Sources available in graphic."). "link": a short post with the link card instead.
    mode: photo
    # A link in the caption costs reach and the card already carries the sources. Off by default.
    include_link: false
    # When each day's articles go out, in newsroom local time, best ranked first. "now"
    # posts as soon as the site is live; a clock time hands Facebook a scheduled post it
    # releases then. Three stories spread across the day reach more people than three in
    # one minute. A slot already past, or under ten minutes away, posts at once.
    slots: ["now", "12:30", "18:30"]
