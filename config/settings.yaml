# Newsroom settings. Environment variables override a few of these:
#   ANTHROPIC_API_KEY   required for a live run
#   OPENAI_API_KEY      optional, enables AI image generation
#   SITE_URL            overrides site.url (the daily workflow sets it from GitHub Pages)
#   NEWSROOM_MOCK=1     forces mock mode (no network, no keys)

site:
  name: "Nepal Wire"
  # The name as it appears on the Nepali edition and in Nepali captions.
  name_ne: "नेपाल वायर"
  tagline: "Nepal's day, ranked and checked before it reaches you"
  tagline_ne: "नेपालको दिन, तपाईंसम्म आउनुअघि क्रमबद्ध र जाँचिएको"
  # GitHub Pages serves a project site at https://<owner>.github.io/<repo>/
  url: "https://inquisitive013.github.io/nepal-news-rss"
  # Your own domain once it points at GitHub Pages (README: Your own domain). Empty keeps the address above.
  custom_domain: ""
  # Shown on the sponsor and standards pages. Empty hides the address.
  contact_email: ""
  # The token from Google Search Console's HTML tag method, e.g. "abc123...". Empty renders nothing.
  google_site_verification: ""
  # A verified line for the sponsor page, e.g. "10,300 followers as of September 2026". Empty keeps the generic wording.
  facebook_followers: "10,336 followers on Facebook as of September 27, 2026"
  # Public address of the source repository, if you want the site to link to it. Empty
  # renders no repository links, which is right for a private repository.
  repo_url: ""
  # The Facebook Page, e.g. "https://www.facebook.com/nepalwire". Linked in the footer and used
  # as the corrections channel when no contact email is set. Empty renders no link.
  facebook_url: ""

newsletter:
  # The provider's subscribe page (Beehiiv, Substack, Buttondown). Rendered as a button wherever the sign up box appears.
  signup_url: ""
  # The provider's embed form HTML, if you prefer the form inline. Wins over signup_url.
  embed_html: ""
  # The paid tier for the investigations. Empty hides the member links.
  members_url: ""

ads:
  # Google AdSense publisher id, e.g. "ca-pub-1234567890123456". Empty renders no ads and no ads.txt.
  adsense_client: ""
  # Language the newsroom writes and judges in: "en". Sources are read in Nepali and English.
  # The Nepali edition is written again from the approved story's record (pipeline.nepali_edition).
  language: "en"
  timezone: "Asia/Kathmandu"
  publisher: "Nepal Wire newsroom"

pipeline:
  # Hours back from run time that count as "today".
  window_hours: 24
  # Hard caps that keep a bad feed from flooding the day.
  max_candidates: 150
  max_per_source: 15
  # How many stories go through the advocate vs skeptic debate. Two calls per story.
  # With three debated and three written, the ranking judges order the stories and can
  # still drop a weak one. They no longer choose among extras.
  max_debate_stories: 3
  # How many of the judged stories become articles.
  articles_per_day: 3
  # Before the writer starts, an investigator searches for what the coverage misses:
  # the record, numbers that do not add up, who benefits, the missing question, the
  # pattern. One call per article with web search. Set false to skip it.
  investigate: true
  # Red team and defence passes per article. With one, the red team reads the first draft
  # only and validation judge 2 reads the revision as the final check.
  red_team_rounds: 1
  # Revisions allowed per article: one after judge 1, one more if judge 2 sends it back.
  max_revisions: 2
  # Revisions allowed across the whole day. Caps the reviser at this many calls.
  max_revisions_per_run: 5
  # Parallel debates / articles in flight.
  concurrency: 3
  # After approval, a Nepali writer writes each story again from its verified record, the way
  # Nepali news is written (config/style_ne.md), and a Nepali editor reads it against the record.
  # One writer call, then per editor pass one check and, if it asks, one fix. Set false to
  # publish the English edition only.
  nepali_edition: true
  # Editor passes per story. One means: the editor reads the piece once and the writer applies
  # every fix it asks for. Two adds a second reading and fix. In all five stories written so far
  # the second reading still found errors the first fix had left or made: a detail not in the
  # record, a dropped attribution, a headline that read as if Rana was still held. Keep two.
  nepali_rounds: 2
  # How the editor's fixes go in. "rewrite": the writer applies them all, leaves every sentence
  # no fix touches as it was, and returns the whole piece. "in_place": each fix replaces the
  # passage the editor quoted and nothing else moves; the writer places only the fixes whose
  # passage it cannot find. The 28 September trial kept rewrite: in place pasted the editor's own
  # instructions into two of three ledes and doubled a clause in a third story's dek.
  nepali_fix: rewrite
  # Safety valve. The run stops taking new work after this many model calls.
  # A normal day is about 48: clusterer 1, advocate 3, skeptic 3, ranking judges 2, then per
  # story investigator 1, writer 1, picture check 1, red team 1, defence 1, judges 2, reviser 1,
  # Nepali writer 3 and Nepali editor 2. The worst day, every send back the caps allow and a
  # second picture round for each story, is 55.
  # 66 from 30 September: the Nepali editor's final reading adds one call a story (53 calls that day).
  max_llm_calls: 66

llm:
  # Default model and thinking effort for every role. Override a role under `roles`.
  # The first live edition on claude-opus-5 at high effort with two revision rounds
  # cost about 19 dollars. The second, on Sonnet 5 with Opus 5.5 judges and two red team
  # rounds, about 6.40. With the investigator and the Nepali edition, a three story day with
  # every check comes to about 12 at list prices; llm.batch halves every token of it.
  model: "claude-sonnet-5"
  effort: "medium"
  # Replies stream, so this can be large. Thinking counts against it, and the
  # reviser must think and then return a whole article.
  max_tokens: 64000
  # Server side refusal fallback (beta). Set false if your org rejects the beta header.
  refusal_fallback: true
  # The Message Batches API bills every token at half price. Each call becomes a batch of one
  # and waits in Anthropic's queue, so an edition takes longer; the request is the same, so the
  # answer is too. A call that waits past max_wait_minutes is cancelled and asked the normal way
  # at full price on its own; the calls after it still try the queue. After run_minutes every new
  # call goes the normal way: 150 minutes of queueing, one last 15 minute wait and the rest of an
  # edition the normal way fit the daily workflow's four hours. The run record keeps every wait
  # under batch_waits and the run summary names the longest. `python -m newsroom batch-probe`
  # measures the queue: on 28 September its four requests waited 125 to 758 seconds, all
  # answered, and web search worked inside a batch. On 29 September 15 calls went through the
  # queue, most in 2 to 9 minutes, one skeptic in 23; then two calls hit the old 25 minute limit
  # together, the old valve shut the queue for the rest of the run, and 37 of 52 calls paid full
  # price.
  batch:
    enabled: true
    max_wait_minutes: 15
    run_minutes: 150
    poll_seconds: 15
  # List prices in dollars per million tokens, September 2026, for the cost each run records.
  # A cache write costs 1.25 times input. A batch call costs half for every token; searches are
  # counted at full price either way.
  prices:
    claude-sonnet-5: { input: 2.0, output: 10.0, cache_read: 0.2 }
    claude-opus-5-5: { input: 4.0, output: 20.0, cache_read: 0.2 }
  web_search_per_1000: 10.0
  # Web search uses allowed per role call.
  web_search_uses:
    advocate: 3
    skeptic: 3
    writer: 6
    red_team: 5
    defense: 2
    # The investigator lives on search. Records, old reports, budgets, court orders.
    investigator: 8
    # Used only when judge 2 checks a revision the red team will not see again.
    validation_judge: 2
    # The Nepali writer opens the cited Nepali outlets for the original wording of quotes and
    # the spelling of names. Wording and spelling only, never new facts.
    nepali_writer: 3
  roles:
    # The judges read everything and decide. Short replies, so the stronger model is cheap here.
    ranking_judge: { model: "claude-opus-5-5", effort: "high" }
    validation_judge: { model: "claude-opus-5-5", effort: "high" }
    writer: { effort: "high" }
    # The investigation is the newsroom's edge, so it gets the thinking budget too.
    investigator: { effort: "high" }
    # The Nepali edition: Sonnet writes the story in Nepali, Opus edits it against the record.
    nepali_writer: { effort: "high" }
    # A reply is a public statement by Nepal Wire, so the desk thinks before it writes one.
    comment_desk: { effort: "high" }
    nepali_editor: { model: "claude-opus-5-5", effort: "medium" }

editorial:
  exclude_topics:
    - "horoscopes and astrology"
    - "graphic descriptions of violence or accident victims"
    - "unverified rumours about private individuals"
    - "paid promotions and press releases dressed as news"
  # Guidance handed to the judges. Judges decide, these are not hard gates.
  guidance:
    min_virality_score: 60
    min_accuracy_score: 85
    min_defensibility_score: 85

images:
  # Licences accepted for found images. Matched case insensitively as substrings
  # of the licence short name reported by the provider.
  allowed_licenses: ["cc0", "public domain", "pdm", "cc by", "cc-by", "by-sa", "cc by-sa"]
  # The picture desk looks for a real photo of each subject the writer names: the image
  # Wikidata keeps for it, Commons files that depict it, its Commons category, a Commons
  # search, then Openverse. Only when none passes does it generate an illustration.
  max_candidates_for_vision: 6  # pictures the model sees in one round
  picker_rounds: 2  # rounds before the desk gives up on a real photo
  max_search_requests: 48  # free library requests per story, all libraries together
  max_upscale: 2.2  # the card never enlarges a photo more than this
  rotation_days: 30  # a photo a story used in this window is not used again
  max_width: 1600
  jpeg_quality: 84
  # Burn a small credit bar into the stored image so shared copies carry attribution.
  burn_credit: true
  generation:
    # "openai" needs OPENAI_API_KEY. "none" skips generation and uses the cover card.
    provider: "openai"
    openai_model: "gpt-image-1"
    size: "1536x1024"

social:
  # A network is switched on by its secrets alone (see README, "Social media").
  # This list only sets the posting order.
  networks: [x, facebook, instagram, threads, telegram, bluesky, mastodon]
  # Networks listed here are still checked but never posted to. Remove a name to resume.
  paused: []
  # Announce only articles published within this many hours, so connecting a new account
  # never floods it with the archive.
  max_age_hours: 36
  # Hashtags per network, built from each article's tags.
  hashtags: {x: 2, facebook: 3, instagram: 8, threads: 3, telegram: 0, bluesky: 2, mastodon: 3}
  # Instagram and Threads fetch the picture from the site, so wait for the page to be live.
  wait_for_site_seconds: 180
  facebook:
    # "photo": the 1080x1400 card with the caption. "link": a short post with the link card instead.
    mode: photo
    # The card's headline language. "ne": the Nepali card, the Nepali editor's checked card
    # headline in Mukta ExtraBold, falling back to the English card when a story has no Nepali
    # card headline or the site build cannot shape Devanagari. "en": the English card.
    card: ne
    # "short": three Nepali lines under the card, nothing else: what the story changes for the
    # reader, the one fact the coverage missed, and a question about the reader's own life (left
    # out when the story has none). The sources are on the card. A story written before these
    # lines existed uses its two line synopsis. "synopsis": that synopsis only. "full": the older
    # long caption (headline, hook, body, trigger, the close and hashtags) in the languages below.
    caption: short
    # A link in the caption costs reach and the card already carries the sources. Off by default.
    include_link: false
    # Languages of the "full" caption, in order. ["ne", "en"] puts the Nepali caption first with
    # the English under it, one post per story. ["en"] posts English only.
    languages: ["ne", "en"]
    # When each day's articles go out, in newsroom local time, best ranked first. "now"
    # posts as soon as the site is live; a clock time hands Facebook a scheduled post it
    # releases then. Three stories spread across the day reach more people than three in
    # one minute. A slot already past, or under ten minutes away, posts at once.
    slots: ["now", "12:30", "18:30"]
    # The calibration loop (python -m newsroom insights, every six hours): each post read at
    # these hours after it went live, each reading taken within a day of its mark. Meta's
    # names for the post insights to read; it renamed them in November 2025 and June 2026,
    # and a retired name comes back as error code 100 in the reading.
    # The comment desk (python -m newsroom comments, every quarter hour after each slot): new
    # top level comments on posts younger than window_minutes. A reader answering the post's
    # question, a question the story answers, and thanks get a short reply grounded in the
    # record; corrections, legal complaints and comments exposing a private person are left for
    # a person and listed in the run summary; politics, the monarchy and abuse get nothing.
    # reply: false still sorts and lists, and posts nothing. max_calls caps model calls a run.
    comments:
      reply: true
      window_minutes: 120
      max_replies_per_post: 10
      max_replies_per_run: 10
      max_calls: 6
    insights:
      readings_hours: [24, 72]
      metrics:
        viewers: post_total_media_view_unique
        views: post_media_view
      # A Reel's numbers, read at the same hours from its video's insights. The probe
      # (insights --probe) lists every name Meta returns for the newest Reel.
      reel_metrics:
        plays: blue_reels_play_count
        viewers: post_impressions_unique
        avg_watch_ms: post_video_avg_time_watched
        follows: post_video_followers
      # The Page's own totals by day, across everything it has posted: the numbers Business
      # Suite shows. Each run keeps the last eight days in data/insights/page.json.
      page_metrics:
        views: page_media_view
        viewers: page_total_media_view_unique
        follows: page_daily_follows_unique
        unfollows: page_daily_unfollows_unique
